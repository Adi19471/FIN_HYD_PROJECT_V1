# ===============================
# Application Info
# ===============================
spring.application.name=sri-balaji-finance

# ===============================
# Server Configuration
# ===============================
server.port=8881
server.servlet.context-path=/balaji-finance

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/finance_db
spring.datasource.username=root
spring.datasource.password=1234


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

spring.jpa.hibernate.ddl-auto=update




# ===============================
# CORS Configuration
# ===============================
app.cors.allowed-origin=http://localhost:5173

# ===============================
# JWT Configuration
# ===============================
# Base64-encoded 256-bit HS256 signing key. Persisted here (rather than generated
# per boot) so a restart doesn't invalidate every outstanding access token at once.
app.jwt.secret=ORA6m6e9ZZx4/y/wFoZf5+8RJoZ3AzUtLWr7u6fP2T0=
# Access token: 15 minutes
app.jwt.access-token-expiration-ms=900000
# Refresh token: 7 days
app.jwt.refresh-token-expiration-ms=604800000