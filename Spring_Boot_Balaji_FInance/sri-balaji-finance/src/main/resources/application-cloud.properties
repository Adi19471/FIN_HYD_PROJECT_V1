# =====================================================================
# Cloud profile: Render (Spring Boot) + TiDB Cloud (MySQL-compatible DB)
#
# Switched on with SPRING_PROFILES_ACTIVE=cloud on Render. It overrides
# application.properties; NOTHING secret lives in this file. Every value
# below comes from Render's Environment tab (see DEPLOY.md):
#
#   PORT          set by Render itself
#   DB_URL        jdbc:mysql://<tidb-host>:4000/finance_db?sslMode=VERIFY_IDENTITY
#   DB_USERNAME   TiDB user (looks like xxxxxxxx.root)
#   DB_PASSWORD   TiDB password
#   CORS_ORIGIN   https://<firebase-project>.web.app,https://<firebase-project>.firebaseapp.com
#   JWT_SECRET    a NEW random Base64 secret (never the one in application.properties)
# =====================================================================

# Render tells the app which port to listen on.
server.port=${PORT:8881}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Small pool: Render free has 512 MB RAM and TiDB Starter meters requests.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
# TiDB Starter closes idle connections; recycle before it does.
spring.datasource.hikari.max-lifetime=280000
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.keepalive-time=60000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.cors.allowed-origin=${CORS_ORIGIN}
app.jwt.secret=${JWT_SECRET}

logging.level.root=INFO
logging.level.org.hibernate.SQL=WARN
